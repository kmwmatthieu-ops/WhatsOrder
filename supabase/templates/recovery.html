<!-- Supabase > Authentication > Emails > "Reset password" — Sujet : Choisissez un nouveau mot de passe -->
<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2421">
  <h2 style="margin:0 0 12px">Mot de passe oublié ?</h2>
  <p style="line-height:1.5">Appuyez sur le bouton ci-dessous pour choisir un nouveau mot de passe.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&type=recovery&next=/nouveau-mot-de-passe"
       style="background:#0f766e;color:#fff;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:bold;display:inline-block">
      Choisir un nouveau mot de passe
    </a>
  </p>
  <p style="font-size:13px;color:#6b6f6a">Si vous n'avez rien demandé, ignorez cet e-mail : votre mot de passe reste inchangé.</p>
</div>

<!-- Supabase > Authentication > Emails > "Confirm signup" — Sujet : Confirmez votre inscription à WhatsOrder -->
<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2421">
  <h2 style="margin:0 0 12px">Bienvenue sur WhatsOrder 👋</h2>
  <p style="line-height:1.5">Confirmez votre adresse e-mail pour créer votre boutique.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&type=email&next=/onboarding"
       style="background:#0f766e;color:#fff;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:bold;display:inline-block">
      Confirmer mon e-mail
    </a>
  </p>
  <p style="font-size:13px;color:#6b6f6a">Si vous n'êtes pas à l'origine de cette inscription, ignorez cet e-mail.</p>
</div>
